language: universal
extensions:
  - ".go"
  - ".py"
  - ".js"
  - ".ts"
  - ".rb"
  - ".rs"
  - ".java"
  - ".cs"
  - ".php"

# ---------------------------------------------------------------------------
# Router registration patterns
# We don't care about the framework. We care about the method and the path.
# Every HTTP framework ever written uses the same seven words.
# ---------------------------------------------------------------------------
router_registration:

  # Method call — receiver.METHOD("path", ...)
  # Catches: gin, echo, fiber, chi, express, fastify, axum, spring, laravel...
  # anything that does <anything>.(GET|POST|...)("<path>"
  - name: universal_method_call
    pattern: '\.(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|get|post|put|patch|delete|head|options|Get|Post|Put|Patch|Delete|Head|Options)\s*\(\s*["`'']([^"`'']+)["`'']'
    method_group: 1
    path_group: 2

  # Decorator — @anything.get("path")
  # Catches: Flask, FastAPI, NestJS, any decorator-based router
  - name: universal_decorator
    pattern: '@\w+(?:\.\w+)*\.(get|post|put|patch|delete|head|options|GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s*\(\s*["`'']([^"`'']+)["`'']'
    method_group: 1
    path_group: 2

  # Decorator with methods kwarg — @app.route("/path", methods=["GET", "POST"])
  # Catches: Flask @app.route, Django url() with method lists
  - name: universal_route_decorator
    pattern: '@\w+(?:\.\w+)*\.route\s*\(\s*["`'']([^"`'']+)["`'']'
    path_group: 1
    method: "ANY"

  # String-first registration — HandleFunc("/path", handler)
  # Catches: Go stdlib net/http, gorilla/mux
  - name: universal_handlefunc
    pattern: '(?:HandleFunc|Handle)\s*\(\s*"([^"]+)"'
    path_group: 1
    method: "ANY"

  # path() / re_path() — Django urls.py
  - name: universal_django_path
    pattern: '(?:^|\s)(?:re_)?path\s*\(\s*["`'']([^"`'']+)["`'']'
    path_group: 1
    method: "ANY"

# ---------------------------------------------------------------------------
# Group / prefix patterns
# Same story — every framework calls it Group, Mount, Route, or prefix.
# ---------------------------------------------------------------------------
group_prefix:

  # .Group("/prefix") — gin, echo, fiber, express
  - name: universal_group
    pattern: '\.Group\s*\(\s*["`'']([^"`'']+)["`'']'
    path_group: 1

  # .Route("/prefix") — chi
  - name: universal_route_group
    pattern: '\.Route\s*\(\s*["`'']([^"`'']+)["`'']'
    path_group: 1

  # .Mount("/prefix") — chi, Starlette
  - name: universal_mount
    pattern: '\.Mount\s*\(\s*["`'']([^"`'']+)["`'']'
    path_group: 1

  # Blueprint / include_router prefix — Flask, FastAPI
  - name: universal_prefix_kwarg
    pattern: '(?:url_prefix|prefix)\s*=\s*["`'']([^"`'']+)["`'']'
    path_group: 1

# ---------------------------------------------------------------------------
# DB call patterns
# Raw SQL is raw SQL. The string in the call is what matters.
# ---------------------------------------------------------------------------
db_calls:

  # .execute("SELECT ...") / .Execute("SELECT ...")
  # Catches: psycopg, database/sql via cursor, SQLAlchemy core, most ORMs raw mode
  - name: universal_execute
    pattern: '\.(?:execute|Execute|exec|Exec)(?:Context|Many|many)?\s*\([^,)]*,?\s*["`]([^"`]+)["`]'
    library: "sql"
    kind: "exec"

  # .query("SELECT ...") / .Query("SELECT ...")
  # Catches: database/sql, pgx, mysql drivers
  - name: universal_query
    pattern: '\.(?:query|Query)(?:Row|Context|RowContext)?\s*\([^,)]*,?\s*["`]([^"`]+)["`]'
    library: "sql"
    kind: "query"

  # .raw("SELECT ...") / .Raw("SELECT ...")
  # Catches: GORM, Django ORM, Tortoise
  - name: universal_raw
    pattern: '\.(?:raw|Raw)\s*\(\s*["`'']([^"`'']+)["`'']'
    library: "sql"
    kind: "raw"

  # text("SELECT ...") — SQLAlchemy text()
  - name: universal_text
    pattern: '\btext\s*\(\s*["`'']([^"`'']+)["`'']'
    library: "sql"
    kind: "raw"

  # ORM find/create/save/delete — framework-agnostic chainable ORM calls
  - name: universal_orm_find
    pattern: '\.(?:find|Find|filter|Filter|where|Where|all|All)\s*\('
    library: "orm"
    kind: "query"

  - name: universal_orm_create
    pattern: '\.(?:create|Create|insert|Insert|save|Save|add|Add)\s*\('
    library: "orm"
    kind: "exec"

  - name: universal_orm_delete
    pattern: '\.(?:delete|Delete|destroy|Destroy|remove|Remove)\s*\('
    library: "orm"
    kind: "exec"

# ---------------------------------------------------------------------------
# Model / schema definitions
# Class, struct, type — same concept, different syntax.
# ---------------------------------------------------------------------------
models:

  # Go struct
  - name: universal_go_struct
    pattern: '^type\s+(\w+)\s+struct\s*\{'
    kind: "struct"

  # Python class inheriting from anything — BaseModel, Base, Schema, Model...
  - name: universal_py_class
    pattern: '^class\s+(\w+)\s*\(\s*\w+\s*\)'
    kind: "class"

  # TypeScript / JavaScript class
  - name: universal_ts_class
    pattern: '^(?:export\s+)?(?:abstract\s+)?class\s+(\w+)'
    kind: "class"

  # Java / C# class
  - name: universal_java_class
    pattern: '(?:public|private|protected)?\s*(?:abstract\s+)?class\s+(\w+)'
    kind: "class"

# ---------------------------------------------------------------------------
# Skip rules
# ---------------------------------------------------------------------------
skip:
  dirs:
    - .git
    - vendor
    - node_modules
    - dist
    - build
    - __pycache__
    - .venv
    - venv
    - testdata
    - .mypy_cache
    - .pytest_cache
  files:
    - "*_test.go"
    - "mock_*.go"
    - "*.pb.go"
    - "*.gen.go"
    - "test_*.py"
    - "*_test.py"
    - "conftest.py"
    - "*.min.js"
    - "*.spec.ts"
    - "*.test.ts"